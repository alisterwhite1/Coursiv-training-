name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/rca-process-app-f5ua2q
    paths:
      - 'rca-process-map.html'
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile project dependencies
        working-directory: mobile
        run: npm install

      - name: Sync latest web app into native projects
        working-directory: mobile
        run: npm run sync

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rca-navigator-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
