name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject version info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u '+%-d %b %Y')
          BUILD_TIME=$(date -u '+%H:%M UTC')
          sed -i "s/__APP_VERSION__/${SHORT_SHA}/g" index.html
          sed -i "s/__BUILD_DATE__/${BUILD_DATE}/g" index.html
          sed -i "s/__BUILD_TIME__/${BUILD_TIME}/g" index.html
          echo "Injected version: ${SHORT_SHA} built ${BUILD_DATE} ${BUILD_TIME}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
